name: Auto Deploy Beauty Website

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ₹{{ secrets.VPS_HOST }}
          username: ₹{{ secrets.VPS_USER }}
          key: ₹{{ secrets.VPS_SSH_KEY }}
          timeout: 60s
          command_timeout: 15m
          script: |
            cd /var/www/globe-trading
            git pull origin main
            npm ci
            npm run build
            pm2 restart globe-trading

